name: Tests

on:
  pull_request:
    branches:
      - main
      
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 20
    - name: Check if the repository is private
      if: ${{github.event.repository.private}}
      run: exit 1
    - name: Get testing lib
      run: set -eu && git clone https://github.com/Yandex-Practicum/tests-blog-customizer.git /tmp/tests-blog-customizer
    - name: Run tests
      run: |
        npm ci
        npm ci --prefix /tmp/tests-blog-customizer
        (cd /tmp/tests-blog-customizer && npx playwright install --with-deps chromium)
        npm run build
        npm run start &
        npx --yes wait-port@1.0.4 -t 30000 localhost:8080
        npm --prefix /tmp/tests-blog-customizer run test
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: report
        path: /tmp/tests-blog-customizer/tmp/artifacts
        retention-days: 30
